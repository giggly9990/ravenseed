# Public face of the demo. Reads are open; of the writes, only the ones that
# reach nothing but the mock services are allowed: searches, adding torrents,
# media lookups, policy dry-runs, monitor scans and checks, and upgrade
# dismissals. Everything else (settings, connection tests, indexer policies,
# presets, monitors, uploads) answers 403 demo_read_only. The seed and smoke
# scripts use the loopback-only admin port instead.
#
# Matching runs on the raw request line, and IDs accept only [A-Za-z0-9_-], so
# encoded or dot-segment paths never pass as an allowed route.
map "$request_method $request_uri" $demo_allowed {
    default 0;
    "~^(GET|HEAD) " 1;
    "~^POST /(login|logout)(\?|$)" 1;
    "~^POST /api/v1/searches(\?|$)" 1;
    "~^POST /api/v1/searches/[A-Za-z0-9_-]+/results/[A-Za-z0-9_-]+/add(\?|$)" 1;
    "~^POST /api/v1/media/resolve(\?|$)" 1;
    "~^POST /api/v1/indexer-policies/[0-9]+/evaluate(\?|$)" 1;
    "~^POST /api/v1/monitors/[A-Za-z0-9_-]+/scan(\?|$)" 1;
    "~^POST /api/v1/monitor-candidates/[A-Za-z0-9_-]+/check(\?|$)" 1;
    "~^POST /api/v1/monitor-candidates/[A-Za-z0-9_-]+/upgrade/(dismiss|add)(\?|$)" 1;
}

# The app rate-limits per client and trusts this proxy's X-Forwarded-For, so
# CF-Connecting-IP is believed only from peers that can set it honestly:
# cloudflared on the ravenseed-demo-edge network (its gateway excluded, since
# published-port traffic can arrive from there) and Cloudflare's edge.
# Anyone else is identified by their own address. Keep the edge subnet in step
# with DEMO_EDGE_SUBNET, and the Cloudflare list with
# https://www.cloudflare.com/ips/.
geo $cf_trusted {
    default 0;
    10.247.90.0/24 1;
    10.247.90.1/32 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$cf_trusted $http_cf_connecting_ip" $client_ip {
    default $remote_addr;
    "~^1 (?<cf_ip>[0-9A-Fa-f:.]+)$" $cf_ip;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        error_page 418 = @read_only;
        if ($demo_allowed = 0) {
            return 418;
        }
        proxy_pass http://ravenseed:8080;
        # Search and monitor progress stream over server-sent events, and the
        # container's filesystem is read-only, so responses are never buffered
        # to disk.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location @read_only {
        default_type application/json;
        return 403 '{"error":{"code":"demo_read_only","message":"This change is disabled in the read-only demo"}}';
    }

    proxy_set_header Host $http_host;
    # Set here, never passed through: the app checks this name against
    # ALLOWED_HOSTS and Origin, so a visitor's own X-Forwarded-Host must not
    # reach it. $http_host keeps the port Origin carries (localhost:8089).
    proxy_set_header X-Forwarded-Host $http_host;
    # Likewise set here so a visitor cannot claim HTTPS: the app trusts this
    # proxy's X-Forwarded-Proto for secure-cookie login checks.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_http_version 1.1;
}
