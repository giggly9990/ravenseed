# RavenSeed public demo for Portainer. Import ravenseed-demo-images.tar under
# Images > Import first (see docs/demo.md). No host ports are published: a
# tunnel container joins the ravenseed-demo-edge network and routes the public
# hostname to http://demo-proxy:8080. The internal network has no internet
# access and is not reachable from the edge network.
services:
  ravenseed:
    image: ravenseed-demo/app:latest
    restart: unless-stopped
    environment:
      TZ: UTC
      DATABASE_PATH: /data/discovery.db
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: 8080
      AUTH_MODE: none
      # Reachable only through demo-proxy, which refuses setting changes.
      ALLOW_UNAUTHENTICATED_REMOTE: "true"
      WEB_COOKIE_SECURE: "true"
      # Only demo-proxy, at its fixed address, may forward a visitor's
      # address (for per-client rate limits).
      TRUSTED_PROXIES: 10.247.89.250
      # Auth is off, so only these Host names (plus loopback) are served:
      # ravenseed for demo-seed and the public demo hostname, e.g.
      # DEMO_ALLOWED_HOSTS=ravenseed,demo.example.org in the stack variables.
      ALLOWED_HOSTS: ${DEMO_ALLOWED_HOSTS:-ravenseed}
      QUI_URL: http://mock-qui:7476
      QUI_API_KEY: demo-key
      TMDB_TOKEN: demo-metadata-key
      TMDB_BASE_URL: http://mock-qui:7476/tmdb/3
      DEFAULT_TARGET_INDEXER: 3
      # Visitors start searches; drop them, and ended upload jobs, after a day.
      HISTORY_RETENTION: 24h
      LOG_LEVEL: info
    volumes:
      - demo-data:/data
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mock-qui
    stop_grace_period: 20s
  mock-qui:
    image: ravenseed-demo/mock-qui:latest
    restart: unless-stopped
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  demo-proxy:
    image: ravenseed-demo/proxy:latest
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 10.247.89.250
      edge: {}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ravenseed
  # Runs once: mock Radarr and Sonarr, a Demo Beacon policy and a Demo Atlas
  # monitor, with Upload-Assistant off. Existing demo settings are kept on
  # later starts. It waits up to two minutes for RavenSeed and mock-qui; a
  # failure exits nonzero with its reason in the log, and a few retries cover
  # a slower start without looping on a lasting fault.
  demo-seed:
    image: ravenseed-demo/seed:latest
    command: ["http://ravenseed:8080"]
    restart: on-failure:5
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ravenseed

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.247.89.0/24
  edge:
    name: ravenseed-demo-edge
    ipam:
      config:
        - subnet: 10.247.90.0/24

volumes:
  demo-data:
