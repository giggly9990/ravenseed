# Isolated test stack: RavenSeed against mock qui, TMDb, Sonarr, Radarr and
# Upload-Assistant services, on its own volume. `make smoke` starts and seeds
# it; see the README's Test stack section.
services:
  ravenseed:
    image: ravenseed-demo/app:latest
    environment:
      AUTH_MODE: none
      API_TOKEN: ""
      WEB_USERNAME: ""
      WEB_PASSWORD: ""
      WEB_PASSWORD_FILE: ""
      WEB_PASSWORD_HASH: ""
      WEB_PASSWORD_HASH_FILE: ""
      WEB_COOKIE_SECURE: "true"
      PUBLISHED_BIND_ADDRESS: 127.0.0.1
      QUI_URL: http://mock-qui:7476
      QUI_API_KEY: demo-key
      TMDB_TOKEN: demo-metadata-key
      TMDB_BASE_URL: http://mock-qui:7476/tmdb/3
      DEFAULT_TARGET_INDEXER: 3
    # AUTH_MODE is none, so this port has full access to settings: it binds to
    # loopback only.
    ports: !override
      - "127.0.0.1:8090:8080"
    volumes: !override
      - demo-data:/data
    # The stack talks to the mocks only; drop the base file's route to the host.
    extra_hosts: !reset []
    depends_on:
      - mock-qui
  mock-qui:
    image: ravenseed-demo/mock-qui:latest
    build:
      context: .
      target: mock
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  demo-data:
