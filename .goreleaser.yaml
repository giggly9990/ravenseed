version: 2
project_name: ravenseed
# dist/ may hold untracked local files; --clean would delete them.
dist: .release

before:
  hooks:
    - npm --prefix web ci --no-audit --no-fund
    - npm --prefix web run build

builds:
  - id: ravenseed
    main: ./cmd/server
    binary: ravenseed
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - id: ravenseed
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - .env.example
      - src: web/dist/**/*
        dst: web

nfpms:
  - id: ravenseed
    package_name: ravenseed
    file_name_template: '{{ .PackageName }}_{{ .Version }}_{{ .Arch }}'
    homepage: https://github.com/giggly9990/ravenseed
    maintainer: giggly9990 <256953737+giggly9990@users.noreply.github.com>
    license: AGPL-3.0-or-later
    description: Finds equivalent releases across the indexers configured in qui.
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: web/dist/
        dst: /usr/share/ravenseed/web
        type: tree
      - src: LICENSE
        dst: /usr/share/doc/ravenseed/LICENSE
      - src: packaging/ravenseed.service
        dst: /usr/lib/systemd/system/ravenseed.service
      - src: packaging/ravenseed.env
        dst: /etc/ravenseed/ravenseed.env
        type: config|noreplace
        file_info:
          mode: 0640
    scripts:
      preinstall: packaging/preinstall.sh
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  abbrev: 7
  format: '{{ .SHA }} {{ .Message }}'
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'

release:
  github:
    owner: giggly9990
    name: ravenseed
  prerelease: auto
  draft: false
  footer: |
    ## Install

    **Docker** (linux/amd64, linux/arm64)

    ```sh
    docker pull ghcr.io/giggly9990/ravenseed:{{ .Version }}
    ```

    With the repository's Compose file, set `image: ghcr.io/giggly9990/ravenseed:{{ .Version }}` in an override and drop `build`.

    **Debian / Ubuntu**

    ```sh
    curl -LO https://github.com/giggly9990/ravenseed/releases/download/{{ .Tag }}/ravenseed_{{ .Version }}_amd64.deb
    sudo apt install ./ravenseed_{{ .Version }}_amd64.deb
    ```

    **Fedora / RHEL**

    ```sh
    sudo dnf install https://github.com/giggly9990/ravenseed/releases/download/{{ .Tag }}/ravenseed_{{ .Version }}_amd64.rpm
    ```

    After installing either package, set your qui URL and API key in `/etc/ravenseed/ravenseed.env`, then run `sudo systemctl enable --now ravenseed` and open http://localhost:8080.

    **Alpine**

    ```sh
    wget https://github.com/giggly9990/ravenseed/releases/download/{{ .Tag }}/ravenseed_{{ .Version }}_amd64.apk
    apk add --allow-untrusted ./ravenseed_{{ .Version }}_amd64.apk
    ```

    The package is unsigned, hence `--allow-untrusted`. It has no OpenRC service; edit `/etc/ravenseed/ravenseed.env`, then start it with `su -s /bin/sh ravenseed -c 'set -a; . /etc/ravenseed/ravenseed.env; exec ravenseed'`.

    On ARM, replace `amd64` with `arm64` in the file names.

    **Linux, macOS, Windows archives:** download the archive for your system below, extract it and run `ravenseed` (`ravenseed.exe` on Windows), then open http://localhost:8080. Configuration uses the variables in the included `.env.example`.

    Verify a download with `sha256sum --ignore-missing -c checksums.txt`.
