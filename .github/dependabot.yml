version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      web-minor:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint has no TypeScript 7 support yet; revisit when it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  # Updates the tags and digests pinned in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # Stay on even-numbered (LTS) Node lines; odd majors never get LTS.
      - dependency-name: node
        versions: ["27.x", "29.x", "31.x"]
